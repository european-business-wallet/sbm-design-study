<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<!-- figure
owner: the maintainer (README, Feedback)
source: docs/diagrams/identity-proof-map.svg (hand-written SVG; this file is the source)
question: Why is a returned key or claim trusted? Which record authorises which key, for an entity and for a provider, and where do qualification and admission enter?
profile: all; the provider chain's register is exercised from profile 2, and MSP participation in it is planned (Batch B)
status: current
references: umbrella §5.2 (directory record), §7.1.1 (federation trust model), §8 (discovery documents), §13.1 (institutional roles); federation-register-openapi.yaml; schemas/bw-provider.schema.json; docs/architecture-identity-trust.md
alt: Two chains side by side. For an entity: a qualified issuer issues the UID; the EDD core registry's directory record, sealed by the registry operator, says where to resolve the entity and pins the entity's authorised seal keys; a pinned key seals the entity's BW-MED, BW-ORG and BW-MEMBER; BW-MEMBER publishes each device's confirmation key and MLS leaf, and BW-MED today publishes the Delivery Service's receipt key; the device's MLS credential authenticates the channel and its confirmation key signs the device's acts. For a provider: the Federation Authority's key is an anchor configured in the verifier; the membership register's record, sealed by it, gives the participant's admission history and pins the key that seals its BW-PROVIDER descriptor of roles and endpoints; an RDP's evidence seal is checked against that admission at the instant of each act. The EU Trusted Lists sit beneath both: they qualify issuers, seal certificates, registered delivery services and time-stamping — which says a provider is qualified, not that it is admitted, nor that a key speaks for a given entity.
-->
  <title>Identity and proof provenance — which record authorises which key</title>
  <desc>Two chains: an entity's (UID issuer, directory record, pinned entity seal key, discovery documents, device keys) and a provider's (Federation Authority anchor, membership record, pinned descriptor key, BW-PROVIDER, the RDP's evidence seal checked for admission at the act). The EU Trusted Lists qualify certificates and services beneath both, separately from admission and entity authorisation.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="660" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Identity and proof provenance — which record authorises which key</text>

  <text x="235" y="56" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8" letter-spacing="0.4">AN ENTITY — who it is, which keys speak for it</text>
  <text x="725" y="56" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155" letter-spacing="0.4">A PROVIDER — whether it may act, which keys speak for it</text>

  <g font-size="11" fill="#475569">
    <!-- Entity chain -->
    <rect x="30" y="68" width="410" height="46" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="235" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">UID issuer — a QTSP (QEAA) or PubEAA</text>
    <text x="235" y="103" text-anchor="middle">issues the UID as a qualified attestation</text>

    <rect x="30" y="140" width="410" height="62" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="235" y="158" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">EDD core registry — the directory record</text>
    <text x="235" y="175" text-anchor="middle">UID → where to resolve (med_url) + authorized_seal_keys</text>
    <text x="235" y="191" text-anchor="middle">sealed by the registry operator's QSealC, time-stamped</text>

    <rect x="30" y="228" width="410" height="46" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="235" y="246" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">The entity's seal key — pinned for this UID only</text>
    <text x="235" y="263" text-anchor="middle">seals BW-MED · BW-ORG · BW-MEMBER (LINT-TRUST-05)</text>

    <rect x="30" y="300" width="410" height="62" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="235" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Discovery documents</text>
    <text x="235" y="335" text-anchor="middle">BW-MEMBER: each device's confirmation key and MLS leaf</text>
    <text x="235" y="351" text-anchor="middle">BW-MED: the DS receipt key — today; PLANNED: MSP descriptor</text>

    <rect x="30" y="388" width="410" height="62" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="235" y="406" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Device keys</text>
    <text x="235" y="423" text-anchor="middle">MLS credential → authenticates the channel, inside MLS</text>
    <text x="235" y="439" text-anchor="middle">confirmation key → signs the device's acts</text>

    <!-- Provider chain -->
    <rect x="520" y="68" width="410" height="46" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
    <text x="725" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Federation Authority key — a configured anchor</text>
    <text x="725" y="103" text-anchor="middle">supplied to the verifier; not derived from the Trusted Lists</text>

    <rect x="520" y="140" width="410" height="62" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
    <text x="725" y="158" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Membership register — the participant's record</text>
    <text x="725" y="175" text-anchor="middle">status history: admitted, suspended, excluded — by instant</text>
    <text x="725" y="191" text-anchor="middle">+ authorized_seal_keys; speaks up to its own asserted_at</text>

    <rect x="520" y="228" width="410" height="46" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
    <text x="725" y="246" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">The participant's descriptor key — pinned for it</text>
    <text x="725" y="263" text-anchor="middle">seals BW-PROVIDER (LINT-TRUST-07)</text>

    <rect x="520" y="300" width="410" height="62" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
    <text x="725" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">BW-PROVIDER — the provider's descriptor</text>
    <text x="725" y="335" text-anchor="middle">its roles and endpoints</text>
    <text x="725" y="351" text-anchor="middle">RDPs today; MSPs PLANNED (Batch B)</text>

    <rect x="520" y="388" width="410" height="62" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
    <text x="725" y="406" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">The RDP's evidence seal + qualified timestamp</text>
    <text x="725" y="423" text-anchor="middle">seals SE · DE · NDE · RE · EP</text>
    <text x="725" y="439" text-anchor="middle">its rdp_id must be admitted at each act's own instant</text>
  </g>

  <!-- chain arrows and verbs -->
  <g font-size="10.5" fill="#1f2937">
    <line x1="235" y1="115" x2="235" y2="138" stroke="#334155" stroke-width="1.4" marker-end="url(#a)"/><text x="243" y="131">recorded in</text>
    <line x1="235" y1="203" x2="235" y2="226" stroke="#334155" stroke-width="1.4" marker-end="url(#a)"/><text x="243" y="219">pins (authorises)</text>
    <line x1="235" y1="275" x2="235" y2="298" stroke="#334155" stroke-width="1.4" marker-end="url(#a)"/><text x="243" y="291">seals</text>
    <line x1="235" y1="363" x2="235" y2="386" stroke="#334155" stroke-width="1.4" marker-end="url(#a)"/><text x="243" y="379">publishes</text>

    <line x1="725" y1="115" x2="725" y2="138" stroke="#334155" stroke-width="1.4" marker-end="url(#a)"/><text x="733" y="131">seals</text>
    <line x1="725" y1="203" x2="725" y2="226" stroke="#334155" stroke-width="1.4" marker-end="url(#a)"/><text x="733" y="219">pins (authorises)</text>
    <line x1="725" y1="275" x2="725" y2="298" stroke="#334155" stroke-width="1.4" marker-end="url(#a)"/><text x="733" y="291">seals</text>
  </g>
  <!-- admission at the act -->
  <path d="M 930 171 C 952 171, 952 419, 932 419" fill="none" stroke="#334155" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="725" y="380" text-anchor="middle" font-size="10.5" fill="#334155">↓ admission from the register, checked at each act's instant</text>

  <!-- Trusted Lists -->
  <rect x="30" y="490" width="900" height="72" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="480" y="512" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">EU Trusted Lists — qualification</text>
  <text x="480" y="530" text-anchor="middle" font-size="11" fill="#475569">qualified issuers (QEAA), seal certificates (QSealC), registered delivery services (QERDS), time-stamping</text>
  <text x="480" y="548" text-anchor="middle" font-size="11" fill="#475569">qualified is not admitted, and a qualified certificate does not speak for an entity unless the directory pins it</text>
  <g stroke="#64748b" stroke-width="1" stroke-dasharray="2 3" fill="none">
    <path d="M 18 488 L 18 91 L 27 91" marker-end="url(#g)"/>
    <path d="M 454 488 L 454 251 L 443 251" marker-end="url(#g)"/>
    <line x1="880" y1="488" x2="880" y2="452" marker-end="url(#g)"/>
  </g>
  <text x="24" y="478" font-size="10" fill="#64748b">qualifies the issuer</text>
  <text x="448" y="478" font-size="10" fill="#64748b" text-anchor="end">qualifies the certificate</text>
  <text x="874" y="476" font-size="10" fill="#64748b" text-anchor="end">qualifies seal and service</text>

  <!-- Legend -->
  <g font-size="10.5" fill="#475569">
    <line x1="30" y1="592" x2="62" y2="592" stroke="#334155" stroke-width="1.4"/>
    <text x="68" y="596">authorises or seals (the record below is trusted because of the one above)</text>
    <line x1="30" y1="612" x2="62" y2="612" stroke="#64748b" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="68" y="616">qualification — a separate gate</text>
    <text x="30" y="640">PLANNED — decided, not implemented (Batch B). What a sealed statement cannot establish — that an untrusted observer reported a true event — is the S2 question (A9).</text>
  </g>
</svg>
